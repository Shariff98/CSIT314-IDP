{% extends "base.html" %}
{% block content %}
<h1 class="h3">{{ 'Edit profile' if profile else 'Create user profile' }}</h1>
<form method="post" class="col-md-6">
  <label class="form-label">Name</label><input class="form-control mb-2" name="name" value="{{ form.name }}" required>
  <label class="form-label">Description and permissions</label>
  <textarea class="form-control mb-3" name="description" rows="3" required>{{ form.description }}</textarea>
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-link" href="{{ url_for('account.list_profiles') }}">Cancel</a>
</form>
{% endblock %}
