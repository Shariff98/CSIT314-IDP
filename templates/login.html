{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
<div class="card shadow-sm"><div class="card-body">
<h1 class="h4 mb-3">Log in</h1>
<form method="post">
  <input class="form-control mb-2" name="email" type="email" placeholder="Email" required autofocus>
  <input class="form-control mb-3" name="password" type="password" placeholder="Password" required>
  <button class="btn btn-primary w-100">Log in</button>
</form>
<p class="small text-muted mt-3 mb-0">New customer? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div></div></div></div>
{% endblock %}
