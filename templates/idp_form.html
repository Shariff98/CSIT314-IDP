{% extends "base.html" %}
{% from "_macros.html" import options %}
{% block content %}
<h1 class="h3">{{ 'Edit project' if idp else 'Create a portfolio project' }}</h1>
<form method="post" class="col-lg-8">
  <div class="row g-2">
    <div class="col-12"><label class="form-label">Title</label><input class="form-control" name="title" value="{{ form.title }}" required></div>
    <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="4" required>{{ form.description }}</textarea></div>
    <div class="col-md-6"><label class="form-label">Category</label><select class="form-select" name="category" required>{{ options(categories, form.category) }}</select></div>
    <div class="col-md-6"><label class="form-label">Budget ($)</label><input class="form-control" name="budget" type="number" min="1" value="{{ form.budget }}" required></div>
    <div class="col-md-4"><label class="form-label">Property type</label><select class="form-select" name="property_type">{{ options(property_types, form.property_type, "—") }}</select></div>
    <div class="col-md-4"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ form.location }}"></div>
    <div class="col-md-4"><label class="form-label">Completion date</label><input class="form-control" name="completion_date" type="date" value="{{ form.completion_date or '' }}"></div>
    {% if not idp %}<div class="col-12"><label class="form-label">Style tags (comma separated, up to 5)</label>
      <input class="form-control" name="style_tags" value="{{ form.style_tags }}" placeholder="{{ styles[:3]|join(', ') }}"></div>{% endif %}
  </div>
  <div class="mt-3">
    {% if idp %}<button class="btn btn-primary">Save changes</button>
    <a class="btn btn-link" href="{{ url_for('portfolio.my_idp', idp_id=idp.id) }}">Cancel</a>
    {% else %}<button class="btn btn-primary" name="action" value="publish">Create and publish</button>
    <button class="btn btn-outline-secondary" name="action" value="draft">Save as draft</button>{% endif %}
  </div>
</form>
{% endblock %}
