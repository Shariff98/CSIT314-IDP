<div class="row g-2">
  <div class="col-md-6"><label class="form-label">Company name</label><input class="form-control" name="name" value="{{ form.name }}" required></div>
  <div class="col-md-6"><label class="form-label">Registration number</label><input class="form-control" name="registration_no" value="{{ form.registration_no }}" required></div>
  <div class="col-12"><label class="form-label">Address</label><input class="form-control" name="address" value="{{ form.address }}" required></div>
  <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ form.phone }}"></div>
  <div class="col-md-6"><label class="form-label">Contact email</label><input class="form-control" name="email" type="email" value="{{ form.email }}" required></div>
  <div class="col-12"><label class="form-label">About the company</label><textarea class="form-control" name="description" rows="3">{{ form.description }}</textarea></div>
</div>
